<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>
      <%= htmlWebpackPlugin.options.title %>
    </title>
    <!-- Open Graph data -->
    <!-- <meta property="og:title" content="Title Here" /> -->
    <!-- <meta property="og:url" content="http://www.example.com/" /> -->
    <!-- <meta property="og:image" content="http://example.com/image.jpg" /> -->
    <!-- <meta property="og:description" content="Description Here" /> -->
    <meta name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="<%= BASE_URL %>static/index.<%= VUE_APP_INDEX_CSS_HASH %>.css" />
    <script src="/libs/quill-1.3.7.min.js"></script>
    <script src="/libs/image-resize-3.0.1.min.js"></script>
    <!-- 引入 App web-view 通信 SDK，使用本地文件避免 App 内 WebView 访问 CDN 失败。 -->
    <script src="<%= BASE_URL %>static/js/uni.webview.1.5.4.js"></script>
    <script>
      // 只保留宿主 web-view SDK，避免误把 H5 自己的 uni 路由当成 App 路由。
      window.uniWebview = window.uni && window.uni.webView
    </script>
  </head>
  <body>
    <noscript>
      <strong>Please enable JavaScript to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
